[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lfw"
version = "0.1.0"
description = "WeSave: satellite hotspot screening and human-approved alerts for Indian landfills"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "cedarpy>=4.12",
]

[project.optional-dependencies]
agent = ["strands-agents>=1.59", "strands-agents-tools>=0.8"]
# pillow: outline review images; boto3: already in the Lambda runtime; moto: AWS mocks for tests;
# uv: Linux dependency locks; cfn-lint: template checks; ruff: static checks.
dev = ["pytest>=8.0", "pillow>=10", "boto3>=1.34", "moto[dynamodb,s3,sns,ssm]>=5.0", "uv>=0.4", "cfn-lint>=1.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lfw = ["policies/*.cedar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "UP", "SIM", "RUF100"]
