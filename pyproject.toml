[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lfw"
version = "0.1.0"
description = "Landfill Fire Watch: satellite hotspot screening and human-approved alerts for Indian landfills"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pillow>=10", "boto3>=1.34"]  # pillow: review images; boto3: in the Lambda runtime already

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
